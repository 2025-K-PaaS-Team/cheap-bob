# version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cheapbob-postgres
    environment:
      POSTGRES_USER: cho
      POSTGRES_PASSWORD: hyeonsang
      POSTGRES_DB: chohyeonsang
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - cheapbob-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cho -d chohyeonsang"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payment:
    # payment-backend 전용 별도 인스턴스. MSA 데이터 분리 — 같은 호스트에서 다른 컨테이너로 운용.
    image: postgres:16-alpine
    container_name: cheapbob-postgres-payment
    environment:
      POSTGRES_USER: cho
      POSTGRES_PASSWORD: hyeonsang
      POSTGRES_DB: chohyeonsang_payment
    volumes:
      - postgresql-payment-data:/var/lib/postgresql/data
    networks:
      - cheapbob-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cho -d chohyeonsang_payment"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: cheapbob-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: cho
      MONGO_INITDB_ROOT_PASSWORD: hyeonsang
      MONGO_INITDB_DATABASE: chohyeonsang
    volumes:
      - mongodb-data:/data/db
    networks:
      - cheapbob-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cheapbob-redis
    volumes:
      - redis-data:/data
    networks:
      - cheapbob-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    # KRaft 모드 단일 노드 — dev/MVP 용. ZooKeeper 의존성 없음.
    # PLAINTEXT(kafka:9092): 컨테이너 네트워크 내부 (main-backend/payment-backend 가 사용)
    # PLAINTEXT_HOST(29092): 호스트에서 kafka-ui / 디버깅 클라이언트가 접속
    image: apache/kafka:latest
    container_name: cheapbob-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 토픽 auto-create 끔 — 운영과 동일한 동작. 모든 토픽은 kafka-init 가 명시 생성.
      # 오타 토픽 produce / 누락된 .dlq 토픽 등을 dev 단계에서 즉시 발견.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - cheapbob-network
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 10

  kafka-init:
    # 비즈니스 토픽 + DLQ 토픽 명시 생성. kafka 가 healthy 된 후 1회 실행.
    # --if-not-exists 로 멱등 — 재기동 시 안전. 새 토픽 추가는 아래 TOPICS 배열에 한 줄.
    image: apache/kafka:latest
    container_name: cheapbob-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - cheapbob-network
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BROKER=kafka:9092
        # 비즈니스 토픽 — DLQ 는 같은 이름 + .dlq 로 자동 생성됨.
        TOPICS=(
          order.refund.requested
          payment.refund.completed
          payment.refund.failed
          seller.store.withdrawn
        )
        # DLQ retention — 30일 (운영자 조사 / replay 시간 확보).
        DLQ_RETENTION_MS=2592000000
        for t in "$${TOPICS[@]}"; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BROKER --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BROKER --create --if-not-exists \
            --topic "$$t.dlq" --partitions 3 --replication-factor 1 \
            --config retention.ms=$$DLQ_RETENTION_MS
        done
        echo "[kafka-init] 토픽 생성 완료 — $${#TOPICS[@]} 개 비즈니스 + $${#TOPICS[@]} 개 DLQ"

  kafka-ui:
    # dev 편의용. 운영 배포 제외.
    image: provectuslabs/kafka-ui:latest
    container_name: cheapbob-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cheapbob
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - cheapbob-network
    depends_on:
      kafka:
        condition: service_healthy

  main-backend:
    build:
      context: ./main-backend
      dockerfile: Dockerfile
    container_name: cheapbob-main-backend
    env_file:
      - ./main-backend/.env
    environment:
      # main-backend → payment-backend 호출 — 컨테이너 네트워크 내부 주소.
      PAYMENT_SERVICE_URL: http://payment-backend:8001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - cheapbob-network
    volumes:
      - ./main-backend/app:/main-backend/app:ro
      - ./main-backend/migration:/main-backend/migration
      - ./main-backend/data:/main-backend/data
      - ./main-backend/logs:/main-backend/logs

  payment-backend:
    build:
      context: ./payment-backend
      dockerfile: Dockerfile
    container_name: cheapbob-payment-backend
    env_file:
      - ./payment-backend/.env
    environment:
      # payment-backend → main-backend 호출 — 컨테이너 네트워크 내부 주소.
      BACKEND_SERVICE_URL: http://main-backend:8000
    ports:
      # /api/internal/* 는 외부 노출 금지 — host port 매핑은 v1 만 위한 것이지만, 같은 8001
      # 포트에 prefix 로 공존한다. 운영 환경에서는 reverse proxy (nginx/traefik) 가
      # /api/internal/* 를 거부해야 한다. dev 한정 localhost 접근만 허용.
      - "8001:8001"
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - cheapbob-network
    volumes:
      - ./payment-backend/app:/payment-backend/app:ro
      - ./payment-backend/migration:/payment-backend/migration
      - ./payment-backend/logs:/payment-backend/logs

networks:
  cheapbob-network:
    driver: bridge

volumes:
  postgresql-data:
    name: cheapbob-postgres-data
  postgresql-payment-data:
    name: cheapbob-postgres-payment-data
  mongodb-data:
    name: cheapbob-mongodb-data
  redis-data:
    name: cheapbob-redis-data
