[project]
name = "cheapbob-payment"
version = "0.1.0"
description = "CheapBob Payment Service (MSA)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosmtplib>=5.0.0",
    "alembic>=1.13.0",
    "apscheduler>=3.10.0",
    "asyncpg>=0.29.0",
    "dependency-injector==4.48.2",
    "fastapi[all]>=0.104.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    # jose / cryptography 는 backend 와 정확히 동일 버전으로 핀.
    # >= 만 두면 두 서비스의 lock 이 시점별로 다른 버전을 잡아 cookie 검증 호환성에 risk.
    "python-jose[cryptography]==3.5.0",
    "cryptography==45.0.6",
    "pytz==2024.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test/unit", "test/integration"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running",
]
